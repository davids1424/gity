<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="title desc">
  <title id="title">gity</title>
  <desc id="desc">The gity wordmark beside a diagram: three SSH key profiles named personal, work and client, each routed through a single key hub.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141b36"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>
    <clipPath id="card"><rect width="960" height="320" rx="22"/></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .wire { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 2 9; opacity: 0.85; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .wire { animation: flow 1.2s linear infinite, take-turns 9s ease-in-out infinite; }
    .w2 { animation-delay: 0s, 3s; }
    .w3 { animation-delay: 0s, 6s; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes flow { to { stroke-dashoffset: -22; } }
    @keyframes take-turns { 0%, 30% { opacity: 1; } 40%, 92% { opacity: 0.28; } 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .cursor, .wire { animation: none; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="960" height="320" fill="url(#bg)"/>
    <rect width="960" height="320" fill="url(#dots)"/>
    <circle cx="852" cy="160" r="150" fill="url(#glow)"/>
  </g>
  <rect x="0.75" y="0.75" width="958.5" height="318.5" rx="21.25" fill="none" stroke="#2a3558" stroke-width="1.5"/>

  <!-- left: prompt, wordmark, tagline -->
  <text class="mono" x="58" y="92" font-size="15" fill="#7d8bb0">
    <tspan fill="#5eead4">$</tspan> <tspan fill="#e6ebff">gity</tspan> clone git@github.com:you/repo.git
  </text>
  <text class="mono" x="54" y="198" font-size="112" font-weight="800" fill="url(#ink)">gity<tspan class="cursor" fill="#a78bfa">_</tspan></text>
  <text class="sans" x="58" y="250" font-size="19" fill="#aab4d4">Many accounts. One git. The right key, every time.</text>

  <!-- right: three key profiles routed through one hub -->
  <path class="wire w1" stroke="#5eead4" d="M742 98 C 790 98, 780 150, 818 156"/>
  <path class="wire w2" stroke="#a78bfa" d="M742 160 L 816 160"/>
  <path class="wire w3" stroke="#fbbf24" d="M742 222 C 790 222, 780 170, 818 164"/>

  <g class="mono" font-size="15" fill="#e6ebff">
    <rect x="600" y="78" width="142" height="40" rx="10" fill="#111935" stroke="#2a3558" stroke-width="1.5"/>
    <circle cx="622" cy="98" r="6" fill="#5eead4"/>
    <text x="638" y="103">personal</text>

    <rect x="600" y="140" width="142" height="40" rx="10" fill="#111935" stroke="#2a3558" stroke-width="1.5"/>
    <circle cx="622" cy="160" r="6" fill="#a78bfa"/>
    <text x="638" y="165">work</text>

    <rect x="600" y="202" width="142" height="40" rx="10" fill="#111935" stroke="#2a3558" stroke-width="1.5"/>
    <circle cx="622" cy="222" r="6" fill="#fbbf24"/>
    <text x="638" y="227">client</text>
  </g>

  <!-- hub with a key glyph -->
  <circle cx="852" cy="160" r="34" fill="#0b1020" stroke="url(#ink)" stroke-width="2.5"/>
  <g fill="none" stroke="#e6ebff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="840" cy="160" r="8"/>
    <path d="M848 160 H 870 M 862 160 V 168 M 869 160 V 166"/>
  </g>
  <text class="mono" x="852" y="220" font-size="13" fill="#7d8bb0" text-anchor="middle">ssh -i</text>
</svg>
